name: Build Windows EXE

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file EXE
        run: dotnet publish VoxelaPrintCalculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Package artifact
        run: Compress-Archive -Path publish\* -DestinationPath Voxela3D-PrintCalculator-win-x64.zip

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxela3D-PrintCalculator-win-x64
          path: Voxela3D-PrintCalculator-win-x64.zip
          if-no-files-found: error
          retention-days: 14
